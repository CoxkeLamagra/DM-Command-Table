services:
  dm-command-table:
    build: .
    ports:
      - "3000:3000"
    environment:
      DM_COMMAND_TABLE_DB_PATH: /data/dm-command-table.sqlite
      DM_COMMAND_TABLE_SECURE_COOKIES: "${DM_COMMAND_TABLE_SECURE_COOKIES:-auto}"
      DM_COMMAND_TABLE_BOOTSTRAP_TOKEN: "${DM_COMMAND_TABLE_BOOTSTRAP_TOKEN:?Set DM_COMMAND_TABLE_BOOTSTRAP_TOKEN}"
      DM_COMMAND_TABLE_REGISTRATION_MODE: "${DM_COMMAND_TABLE_REGISTRATION_MODE:-first-user}"
      DM_COMMAND_TABLE_SCREENSHOT_QUOTA_MB: "${DM_COMMAND_TABLE_SCREENSHOT_QUOTA_MB:-100}"
    volumes:
      - dm-command-table-data:/data
    restart: unless-stopped

volumes:
  dm-command-table-data:
