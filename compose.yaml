services:
  dm-command-table:
    build: .
    init: true
    ports:
      - "${DMCT_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    environment:
      DM_COMMAND_TABLE_V6_DB_PATH: /data/dm-command-table-v6.sqlite
      DM_COMMAND_TABLE_V6_UPLOAD_PATH: /data/uploads-v6
      DM_COMMAND_TABLE_SECURE_COOKIES: "${DM_COMMAND_TABLE_SECURE_COOKIES:-auto}"
      DM_COMMAND_TABLE_BOOTSTRAP_TOKEN: "${DM_COMMAND_TABLE_BOOTSTRAP_TOKEN:?Set DM_COMMAND_TABLE_BOOTSTRAP_TOKEN}"
      DM_COMMAND_TABLE_REGISTRATION_MODE: "${DM_COMMAND_TABLE_REGISTRATION_MODE:-first-user}"
      DM_COMMAND_TABLE_SCREENSHOT_QUOTA_MB: "${DM_COMMAND_TABLE_SCREENSHOT_QUOTA_MB:-100}"
    volumes:
      - dm-command-table-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=64m,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  dm-command-table-data:
